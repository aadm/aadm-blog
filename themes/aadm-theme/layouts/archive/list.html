{{ define "main" }}
  <h1 class="mb-4">{{ .Title }}</h1>

  {{ $pages := where .Site.RegularPages "Type" "post" }}
  {{ range $pages.GroupByDate "2006" "desc" }}
    <h3 class="mb-3">{{ .Key }}</h3>
    <ul class="list-unstyled mb-4">
      {{ range .Pages }}
        <li class="mb-2">
          <span class="text-muted small me-2">{{ .Date.Format "01-02" }}</span>
          <a href="{{ .RelPermalink }}" class="text-decoration-none">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
