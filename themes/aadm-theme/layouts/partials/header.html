<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        {{ $current := .RelPermalink }}
        {{ range .Site.Menus.main }}
          {{ $active := eq $current (.URL | relURL) }}
          <li class="nav-item">
            <a class="nav-link{{ if $active }} active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>
          </li>
        {{ end }}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            {{ .Site.Language.LanguageName }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            {{ range $.Site.Home.AllTranslations }}
              <li><a class="dropdown-item" href="{{ .RelPermalink }}">{{ .Language.LanguageName }}</a></li>
            {{ end }}
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
